# Ce que la revue humaine ne doit pas avoir à vérifier.
#
# Sur `windows-latest` : c'est la seule plateforme sur laquelle AURA est testée, et
# plusieurs gardes du serveur tiennent à des particularités de Windows — la casse du
# système de fichiers, les noms courts 8.3, l'énumération des processus. Les faire tourner
# ailleurs vérifierait autre chose que ce qui est livré.
#
# `build` en plus de `typecheck` : depuis la mise au socle, `pnpm typecheck` ouvre la marche
# par `vue-tsc` et couvre donc le front, ce qu'il ne faisait pas — le build ne rattrape plus
# une rupture de types. Il reste parce qu'il vérifie autre chose : que Quasar sait produire
# le bundle, résoudre les alias et les imports dynamiques du manuel.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest

    # Les actions elles-mêmes tournent sur un Node fourni par l'exécuteur, sans
    # rapport avec celui du projet. Les versions majeures antérieures se
    # déclaraient en `node20`, dont GitHub a annoncé la fin : le workflow passait,
    # en avertissant à chaque exécution. Ces trois-là tournent en `node24`.
    steps:
      - uses: actions/checkout@v7

      # Pas de version ici : `packageManager` dans `package.json` la porte
      # désormais, et l'action refuse de démarrer si les deux se contredisent.
      # Ce qui se joue sur ce numéro : les gardes de `pnpm-workspace.yaml` sont
      # des fonctions de pnpm 11. Sous la 10, `pnpm install` ne vérifie pas le
      # lockfile contre elles — la quarantaine ne protégeait donc que la machine
      # qui résout, et un lockfile fabriqué ailleurs avec une dérogation locale
      # passait la CI sans un mot.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # La seule version que le projet supporte. Il n'y a plus de borne à
          # distinguer d'une version courante : `engines` dit `^24`, la machine
          # de développement tourne en 24, la CI aussi. Une CI qui vérifierait
          # un autre Node ne vérifierait rien de ce qui est livré.
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Les tests lisent le `~/.claude` de la machine s'il existe, et se sautent sinon.
      # Sur un exécuteur neuf il n'y en a pas : ils tournent alors sur leurs fixtures.
      - run: pnpm test

      - run: pnpm build
