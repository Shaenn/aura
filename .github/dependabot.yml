# Ce que Dependabot surveille, et à quel rythme.
#
# Un projet tenu par une personne se noie vite sous les demandes de mise à jour :
# une par dépendance et par semaine, et plus personne ne les lit. Le groupement
# ci-dessous vise l'inverse — peu de demandes, chacune relisible.
#
# La règle est celle du risque, pas celle du calendrier. Les versions mineures et
# correctives arrivent groupées, parce qu'elles se relisent ensemble et que la CI
# suffit à les juger. Les versions majeures arrivent seules, parce qu'elles
# cassent, et qu'on veut savoir laquelle.
#
# Le numéro dit le risque tant que la dépendance a dépassé son premier zéro. En
# dessous, il ne dit plus rien, et c'est le cas de celle dont ce projet dépend le
# plus — voir la note du groupe.

version: 2

updates:
  # Les dépendances du projet. `npm` couvre aussi pnpm : c'est le fichier de
  # verrou qui décide, pas le nom de l'écosystème.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday

    # Aucune version fraîche. C'est le pendant du `minimumReleaseAge` de
    # `pnpm-workspace.yaml`, et les deux gardes ne font pas le même travail :
    # pnpm refuse d'installer, Dependabot refuse de proposer. Sans la seconde,
    # une demande arrive régulièrement sur une version que la première rejette —
    # une branche qu'on ne peut pas installer, donc pas juger.
    #
    # Trois jours plutôt qu'un : le délai ne coûte rien puisqu'il ne s'applique
    # **pas** aux mises à jour de sécurité, qui continuent d'arriver le jour
    # même. Ce qu'on retarde, ce sont les montées de confort ; ce qu'on gagne,
    # c'est le temps qu'un mainteneur mette la main sur une publication qui ne
    # vient pas de lui.
    #
    # C'est aussi le défaut de Dependabot — écrit ici parce qu'une garde qu'on
    # n'a pas déclarée est une garde qu'on ne sait pas relire.
    cooldown:
      default-days: 3

    # Mesuré sur douze mois de publications des 36 dépendances directes : le lot
    # mineur bouge 52 semaines sur 52, le SDK 45 sur 52 — 265 versions — et 28
    # majeures sont franchies dans l'année, soit une tous les treize jours. Le
    # régime établi tient donc en ~2,4 demandes par semaine, et 5 y suffisait.
    #
    # 6 parce que le projet a été bâti sur des versions anciennes et rattrape
    # quatre majeures d'un coup — typescript, app-vite, pinia, @types/node. Ce
    # rattrapage ne se reproduira pas ; ce chiffre est fait pour redescendre.
    open-pull-requests-limit: 6

    # `@types/node` ne décrit pas une bibliothèque : il décrit la surface d'API
    # d'une version majeure de Node. Sa majeure doit donc suivre le runtime, et
    # rien d'autre — le projet tourne en 24, ses types restent en 24.
    #
    # Prendre plus haut ne casse rien à l'installation, ce qui est justement le
    # piège : TypeScript accepterait des API absentes de Node 24, le typecheck
    # passerait, et l'échec n'arriverait qu'à l'exécution. Cette montée-là se
    # décide en changeant `engines`, la CI et la documentation d'un même geste,
    # pas en fusionnant une demande.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

    groups:
      # Un lot par semaine pour tout ce qui ne change pas d'interface.
      #
      # Le SDK d'agent en est tenu à l'écart, et la raison tient à son numéro de
      # version. Il vit en `0.3.x` : sous le premier zéro, semver ne promet
      # **rien**. Le mineur y porte les ruptures franches — `0.3.229` → `0.4.0` —
      # mais le correctif n'est pas un refuge pour autant : entre deux `0.3.x`,
      # une forme de message peut se déplacer sans que le numéro le dise.
      #
      # Ignorer ses majeures n'aurait donc rien protégé, puisqu'il n'en publie
      # pas. Hors du groupe, il arrive seul à chaque version — correctifs
      # compris. C'est plus de demandes que pour les autres, et c'est voulu :
      # c'est la seule dépendance dont la surface est celle sur laquelle
      # l'Atelier est écrit, et la seule qu'on relit avant de prendre.
      mineures:
        patterns: ['*']
        exclude-patterns: ['@anthropic-ai/claude-agent-sdk']
        update-types: [minor, patch]

  # Les actions de la CI. Elles se sont fait oublier une fois — trois versions
  # majeures de retard, et un runtime que GitHub avait annoncé mort.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
