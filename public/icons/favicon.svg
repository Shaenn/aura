<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AURA">
  <!-- Marque AURA — le losange évidé de la barre du haut, porté à l'échelle de
       l'icône : anneau saumon sur fond nuit, noyau plein au centre, halo léger.
       Le noyau est ce qui la sauve en petit : sous 20px l'anneau se referme
       visuellement, et il reste une masse pleine reconnaissable. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#e07a5f" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#e07a5f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0a0a0a" />
  <circle cx="50" cy="50" r="42" fill="url(#glow)" />

  <g transform="rotate(45 50 50)">
    <!-- Anneau : carré extérieur, puis le même évidé au fond — pas de
         transparence à composer, l'icône reste juste sur tout support. -->
    <rect x="21" y="21" width="58" height="58" rx="9" fill="#e07a5f" />
    <rect x="30" y="30" width="40" height="40" rx="5" fill="#0a0a0a" />
    <rect x="41.5" y="41.5" width="17" height="17" rx="3.5" fill="#e9a08b" />
  </g>
</svg>
